<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8orup.dk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #111111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 6vh 20px 40px;
  }
  .brand {
    text-align: center;
    margin-top: 24px;
  }
  .brand a {
    color: #111111;
    text-decoration: none;
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    display: inline-block;
  }
  .brand a:hover { color: #000; }
  .brand .tagline {
    margin-top: 10px;
    font-size: clamp(16px, 2.8vw, 22px);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .frame {
    max-width: 960px;
    width: 100%;
  }
  .frame img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
  }
  .links {
    list-style: none;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    color: #111111;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.15s, border-color 0.15s;
  }
  .links a:hover { background: #f3f4f6; border-color: #d1d5db; }
  .links svg, .links img {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="frame">
    <img src="logo.jpeg" alt="Borup paragliding weather">
  </div>
  <div class="brand">
    <a href="https://8orup.dk">8orup.dk</a>
    <div class="tagline">Thomas Borup</div>
  </div>

  <ul class="links">
    <li>
      <a href="https://8orup.dk" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20z"/>
        </svg>
        8orup.dk
      </a>
    </li>
    <li>
      <a href="https://www.strava.com/athletes/14524845" target="_blank" rel="noopener">
        <img src="https://cdn.simpleicons.org/strava" alt="" aria-hidden="true">
        Strava
      </a>
    </li>
    <li>
      <a href="https://www.instagram.com/borupinsta" target="_blank" rel="noopener">
        <img src="https://cdn.simpleicons.org/instagram" alt="" aria-hidden="true">
        Instagram
      </a>
    </li>
    <li>
      <a href="https://www.facebook.com/thomas.borup.7/" target="_blank" rel="noopener">
        <img src="https://cdn.simpleicons.org/facebook" alt="" aria-hidden="true">
        Facebook
      </a>
    </li>
  </ul>
</body>
</html>
