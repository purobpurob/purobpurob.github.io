<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8ORUP Music</title>
<meta name="description" content="8ORUP – Afro House, Deep House and chilled melodic grooves. Listen on Spotify.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f6bff;--red:#ff2a3d;--bg:#05060a;--text:#e9ecf2;--muted:#9aa3b2;--spotify:#1ed760}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* HERO */
.hero{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 20px 12vh;
  background:url("images/hero.jpg") center 35%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.15) 0%,rgba(5,6,10,0) 40%,rgba(5,6,10,.85) 85%,var(--bg) 100%)}
.hero>*{position:relative;z-index:1}
.logo{font-weight:300;font-size:clamp(2.4rem,7vw,5.5rem);letter-spacing:.35em;margin-right:-.35em;text-shadow:0 0 30px rgba(31,107,255,.45),0 0 60px rgba(255,42,61,.3)}
.logo-sub{display:block;font-size:.38em;letter-spacing:.7em;margin-right:-.7em;margin-top:.4em;color:#cfd5e0}
.tag{font-size:clamp(.8rem,1.6vw,1rem);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:10px 0 36px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;transition:transform .2s,box-shadow .2s}
.btn svg{width:24px;height:24px}
.btn-spotify{background:var(--spotify);color:#000;box-shadow:0 0 0 rgba(30,215,96,0)}
.btn-spotify:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(30,215,96,.35)}
.scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:1;color:var(--muted);font-size:.7rem;letter-spacing:.3em;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}

/* ABOUT */
section{max-width:1080px;margin:0 auto;padding:100px 24px}
.about{display:grid;grid-template-columns:340px 1fr;gap:64px;align-items:center}
.portrait{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait::before{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:linear-gradient(135deg,var(--blue),var(--red));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:1}
.portrait-wrap{position:relative}
.portrait-wrap::after{content:"";position:absolute;inset:10%;z-index:-1;filter:blur(60px);background:linear-gradient(135deg,var(--blue),var(--red));opacity:.45}
h2{font-weight:300;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}
h2 span{white-space:nowrap;background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.about p{color:#c3c9d4;margin-bottom:16px}
.sign{font-weight:700;letter-spacing:.4em;font-size:.85rem;margin-top:24px;background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.quote{font-style:italic;color:var(--text)!important;border-left:2px solid;border-image:linear-gradient(var(--blue),var(--red)) 1;padding-left:16px}

/* GENRES */
.genres{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:0}
.chip{padding:10px 20px;border:1px solid rgba(255,255,255,.12);border-radius:999px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.02);transition:.2s}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.35)}

/* MOODS */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mood{padding:34px 28px;border-radius:16px;background:linear-gradient(160deg,rgba(31,107,255,.08),rgba(255,42,61,.06));border:1px solid rgba(255,255,255,.06)}
.mood h3{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.mood p{color:var(--muted);font-size:.92rem}

/* CTA */
.cta{text-align:center;position:relative}
.cta::before{content:"";position:absolute;left:50%;top:50%;width:70%;height:60%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at 30% 50%,rgba(31,107,255,.25),transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(255,42,61,.25),transparent 60%);filter:blur(40px);z-index:-1}
.cta p{color:var(--muted);margin:-6px 0 32px}

footer{text-align:center;padding:40px 20px 50px;color:#5d6575;font-size:.75rem;letter-spacing:.15em;border-top:1px solid rgba(255,255,255,.05)}
footer .links{display:flex;gap:22px;justify-content:center;margin-bottom:16px}
footer .links a{color:var(--muted);transition:.2s}
footer .links a:hover{color:var(--text)}

@media(max-width:820px){
  .about{grid-template-columns:1fr;gap:40px;text-align:center}
  .portrait-wrap{max-width:280px;margin:0 auto}
  .sign{font-weight:700;letter-spacing:.4em;font-size:.85rem;margin-top:24px;background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.quote{border-left:none;padding-left:0}
  .moods{grid-template-columns:1fr}
  section{padding:70px 22px}
  .hero{background-position:center 30%}
  .tag{letter-spacing:.15em;font-size:.72rem}
}
</style>
</head>
<body>

<header class="hero">
  <h1 class="logo">8ORUP <span class="logo-sub">MUSIC</span></h1>
  <div class="tag">Made to be felt, not just heard.</div>
  <a class="btn btn-spotify" href="https://open.spotify.com/artist/739MrFtBvkPsO56JY6H0pe" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.8-1.7-6.4-2.1-10.6-1.2a.75.75 0 1 1-.33-1.46c4.6-1 8.6-.6 11.7 1.4.36.2.47.67.25 1.02zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.2-2-8.1-2.55-11.9-1.4a.94.94 0 1 1-.55-1.8c4.3-1.3 9.7-.67 13.4 1.6.44.27.58.85.31 1.29zm.13-3.4C15.3 8.4 8.9 8.2 5.2 9.3a1.13 1.13 0 1 1-.65-2.16c4.3-1.3 11.3-1.05 15.7 1.56a1.13 1.13 0 0 1-1.15 1.94z"/></svg>
    Listen on Spotify
  </a>
</header>

</body>
</html>
